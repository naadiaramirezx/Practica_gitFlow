<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Actividad GitFlow</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  
  <body>
    <header>
      <div class="navbar navbar-expand-lg bg-danger">
        <div class="container-fluid">
          <h2 class="navbar-brand text-white mt-2">Menu</h2>
          <div class="collapse navbar-collapse">
            <ul class="navbar-nav mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link">Features</a>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </header>
    <div class="container my-4">
      <h2 class="text-center my-4">Galería</h2>
      <div id="galeriaCarusel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img src="./img/Imagen1.jpg" class="d-block w-100" alt="Image 1" />
          </div>
          <div class="carousel-item">
            <img src="./img/Imagen2.jpg" class="d-block w-100" alt="Image 2" />

          <div class="carousel-item">

          </div>
        </div>
        <button
          class="carousel-control-prev"
          type="button"
          data-bs-target="#galeriaCarusel"
          data-bs-slide="prev"
        >
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button
          class="carousel-control-next"
          type="button"
          data-bs-target="#galeriaCarusel"
          data-bs-slide="next"
